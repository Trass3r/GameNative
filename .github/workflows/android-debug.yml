name: Android Debug CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.flavor_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: ":app:assembleLegacyDebug"
            flavor_name: "Legacy Debug"
            artifact_name: "app-legacy-debug"
            artifact_path: "app/build/outputs/apk/legacy/debug/app-legacy-debug.apk"
            
          - task: ":app:assembleModernDebug"
            flavor_name: "Modern Debug"
            artifact_name: "app-modern-debug"
            artifact_path: "app/build/outputs/apk/modern/debug/app-modern-debug.apk"
            
          - task: ":app:assembleLegacyXrDebug"
            flavor_name: "Legacy Xr Debug"
            artifact_name: "app-legacy-xr-debug"
            artifact_path: "app/build/outputs/apk/legacyXr/debug/app-legacyXr-debug.apk"

    steps:
    - uses: actions/checkout@v7

    - name: Add swap
      run: |
        sudo fallocate -l 8G /mnt/swapfile.ci
        sudo chmod 600 /mnt/swapfile.ci
        sudo mkswap /mnt/swapfile.ci
        sudo swapon /mnt/swapfile.ci
        free -m

    - name: Set up Java 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v6

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v6
      with:
        add-job-summary: 'on-failure'

    - name: Inject dummy credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY=dummy_posthog_key
        POSTHOG_HOST=https://posthog.com
        STEAMGRIDDB_API_KEY=dummy_steamgrid_key
        CLOUD_PROJECT_NUMBER=123456789
        EOF

    - name: Build Variant
      run: ./gradlew -Pkotlin.daemon.jvmargs=-Xmx4g ${{ matrix.task }}

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}
        archive: false
