name: Android Debug CI

on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'keyvalues/**'
      - 'media/**'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Add swap
      run: |
        sudo fallocate -l 8G /mnt/swapfile.ci
        sudo chmod 600 /mnt/swapfile.ci
        sudo mkswap /mnt/swapfile.ci
        sudo swapon /mnt/swapfile.ci
        free -m

    - name: Set up Java 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Validate Gradle wrapper
      uses: gradle/actions/wrapper-validation@v4

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Inject dummy credentials
      run: |
        cat <<EOF > local.properties
        POSTHOG_API_KEY=dummy_posthog_key
        POSTHOG_HOST=https://posthog.com
        STEAMGRIDDB_API_KEY=dummy_steamgrid_key
        CLOUD_PROJECT_NUMBER=123456789
        EOF

    - name: Build Debug APKs with Gradle
      run: |
        ./gradlew -Pkotlin.daemon.jvmargs=-Xmx4g :app:assembleLegacyDebug :app:assembleModernDebug :app:assembleLegacyXrDebug
        free -m

    - name: Stop Gradle daemon to free memory
      run: ./gradlew --stop

    - name: Upload Legacy Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: app-legacy-debug
        path: app/build/outputs/apk/legacy/debug/app-legacy-debug.apk

    - name: Upload Modern Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: app-modern-debug
        path: app/build/outputs/apk/modern/debug/app-modern-debug.apk

    - name: Upload Legacy XR Debug APK
      uses: actions/upload-artifact@v7
      with:
        name: app-legacy-xr-debug
        path: app/build/outputs/apk/legacyXr/debug/app-legacyXr-debug.apk
